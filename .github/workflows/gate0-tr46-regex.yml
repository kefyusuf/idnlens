name: Gate 0 TR46 regex provenance

on:
  pull_request:
  push:
    branches:
      - main
      - 'spike/gate0-tr46-regex-*'

permissions:
  contents: read

jobs:
  tr46-regex-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.16.0'
      - name: Install existing locked package and minimal locked replay tools
        run: |
          npm ci --prefix spikes/gate0 --ignore-scripts --no-audit --no-fund
          npm ci --prefix spikes/gate0/regex-replay --ignore-scripts --no-audit --no-fund
      - name: Fetch exact upstream generator and Unicode input versions
        shell: bash
        run: |
          set -euo pipefail
          PROOF_DIR="$RUNNER_TEMP/idnlens-tr46-regex"
          REPLAY_DIR="spikes/gate0/regex-replay"
          mkdir -p "$PROOF_DIR" "$REPLAY_DIR/scripts" "$REPLAY_DIR/lib"
          echo "IDNLENS_REGEX_PROOF_DIR=$PROOF_DIR" >> "$GITHUB_ENV"
          fetch() {
            curl --fail --silent --show-error --location --retry 2 --max-time 45 \
              --proto '=https' --tlsv1.2 "$1" --output "$2"
          }
          fetch "https://raw.githubusercontent.com/jsdom/tr46/6d09104f21991d496aa2a8535d21bdea91a9c216/scripts/generateRegexes.mjs" "$REPLAY_DIR/scripts/generateRegexes.mjs"
          fetch "https://www.unicode.org/Public/18.0.0/ucd/extracted/DerivedJoiningType.txt" "$PROOF_DIR/DerivedJoiningType.txt"
          fetch "https://www.unicode.org/Public/18.0.0/ucd/extracted/DerivedCombiningClass.txt" "$PROOF_DIR/DerivedCombiningClass.txt"
          sha256sum "$REPLAY_DIR/scripts/generateRegexes.mjs" "$PROOF_DIR/DerivedJoiningType.txt" "$PROOF_DIR/DerivedCombiningClass.txt" "spikes/gate0/node_modules/tr46/lib/regexes.js"
      - name: Run source and offline replay tests
        run: node --test spikes/gate0/tr46-regex-provenance.test.mjs
