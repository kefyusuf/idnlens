name: Gate 0 dependency probe

on:
  pull_request:
  push:
    branches:
      - 'spike/gate0-*'

permissions:
  contents: read

jobs:
  dependency-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.16.0'
      - name: Install exact-version spike dependencies (no scripts)
        working-directory: spikes/gate0
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Print resolved dependency tree
        working-directory: spikes/gate0
        run: npm ls --all
      - name: Execute original Node baseline and candidate tests
        run: node --test spikes/gate0/*.test.mjs
