name: Gate 0 dependency probe

on:
  pull_request:
  push:
    branches:
      - main
      - 'spike/gate0-*'
      - 'decision/gate0-adr-*'

permissions:
  contents: read

jobs:
  dependency-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.16.0'
      - name: Reproducible install from committed lockfile (no scripts)
        working-directory: spikes/gate0
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Print locked dependency tree
        working-directory: spikes/gate0
        run: npm ls --all
      - name: Run dependency and provenance tests
        run: node --test spikes/gate0/idna-dependencies.test.mjs spikes/gate0/dependency-provenance.test.mjs
      - name: Verify Gate 0 decision readiness and no-go boundaries
        run: node --test spikes/gate0/decision-readiness.test.mjs
      - name: Verify staged M0 architectural ADR acceptance boundaries
        run: node --test spikes/gate0/adr-acceptance-proposal.test.mjs
