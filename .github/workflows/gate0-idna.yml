name: Gate 0 IDNA baseline

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  node-idna-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.16.0'
      - name: Show runtime versions
        run: node -p "JSON.stringify({node: process.version, icu: process.versions.icu, unicode: process.versions.unicode})"
      - name: Run Gate 0 tests
        run: node --test spikes/gate0/*.test.mjs
