name: Gate 0 browser bundle footprint

on:
  pull_request:
  push:
    branches:
      - main
      - 'spike/gate0-browser-bundle-*'

permissions:
  contents: read

jobs:
  bundle-footprint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.16.0'
      - name: Run RED browser measurement contract
        run: node --test spikes/gate0/bundle-probe/measure.test.mjs
      - name: Capture npm-generated pinned esbuild lockfile candidate
        if: always()
        working-directory: spikes/gate0/bundle-probe
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --save-exact
          echo BUNDLE_LOCKFILE_BASE64_BEGIN
          base64 -w0 package-lock.json
          echo
          echo BUNDLE_LOCKFILE_BASE64_END
